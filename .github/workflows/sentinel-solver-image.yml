name: Sentinel Solver Image

# Publishes the sentinel solver image the EU host runs next to chatgpt2api
# (/opt/image2 on 169.58.186.30), tagged by commit:
# ghcr.io/meizu16/sentinel-solver:sha-<7 hex>. Nothing deploys it: the host's
# compose file pins one tag and is switched by hand. The image is built from
# sentinel_solver/Dockerfile unchanged, the same build docker-compose.yml uses.
#
# Only changes under sentinel_solver/ build anything; the main service image
# comes from docker-publish.yml. Every build gets its own tag and none moves a
# shared one such as latest, so runs need no concurrency group.

on:
  push:
    branches:
      - main
    paths:
      - "sentinel_solver/**"
      - ".github/workflows/sentinel-solver-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/meizu16/sentinel-solver

jobs:
  image:
    name: Build and push sentinel solver image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # sha-<7 hex>, the tag the EU host's compose file pins. The
          # org.opencontainers.image.revision label carries the full commit.
          tags: |
            type=sha
          # The title would otherwise be the repository's name.
          labels: |
            org.opencontainers.image.title=sentinel-solver

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./sentinel_solver
          file: ./sentinel_solver/Dockerfile
          # The EU host is the only place this runs.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sentinel-solver-image
          cache-to: type=gha,mode=max,scope=sentinel-solver-image,ignore-error=true

      - name: Summarize published image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Sentinel solver image"
            echo
            echo '```'
            echo "$TAGS"
            echo "digest: $DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
